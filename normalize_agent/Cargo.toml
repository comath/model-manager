[package]
name = "normalize-agent"
version = "0.1.0"
edition = "2024"
description = "The dataset-normalizing agent that runs inside the container (one dataset per run)"

[dependencies]
anyhow = "1"
nix = { version = "0.30", default-features = false, features = ["signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[[bin]]
name = "normalize-dataset"
path = "src/main.rs"
